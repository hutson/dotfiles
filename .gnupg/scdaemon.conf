# GnuPG scans every card application when resolving keys by keygrip, and switching
# between applications resets the card's PIN verification state, prompting for the
# PIN on every SSH connection and signing operation (https://dev.gnupg.org/T5436).
# The PIV application is unused on this system, so it is disabled instead of the
# OpenPGP application that stores the subkeys.
disable-application piv

# pcsc-shared is intentionally omitted: in shared mode scdaemon refuses to use the
# PIN cache held by gpg-agent, because other PC/SC clients could reset the card
# between operations, wiping the verification state that the card otherwise keeps
# until it loses power (https://dev.gnupg.org/T7041).
